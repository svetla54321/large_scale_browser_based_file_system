name: filesystem

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: filesystem
      POSTGRES_USER: ${DB_USERNAME:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-test1234}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d filesystem"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/filesystem
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-admin}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-test1234}
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768m
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 60s
      start_interval: 2s

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:

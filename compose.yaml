name: filesystem

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: filesystem
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: test1234
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d filesystem"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:

spring:
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5432}/filesystem
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:test1234}
  flyway:
    clean-disabled: false
    ignore-migration-patterns: "*:future,*:pending"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,loggers

logging:
  structured:
    format:
      console: ""
  level:
    com.svetlecic.filesystem: debug
    org.hibernate.SQL: debug
